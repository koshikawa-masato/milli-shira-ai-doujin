# RunPod Serverless 用ワーカーイメージを GHCR に公開する（Mac は arm64 で amd64 ビルドが面倒なので CI で）
name: runpod-worker
on:
  push:
    branches: [main]
    paths: ["tools/runpod-serverless/**", ".github/workflows/runpod-worker.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tools/runpod-serverless
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/krea2-edit-worker:latest
            ghcr.io/${{ github.repository_owner }}/krea2-edit-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
