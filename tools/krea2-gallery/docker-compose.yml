services:
  gallery:
    build: .
    container_name: krea2-gallery
    restart: unless-stopped
    ports:
      # ホストの localhost にだけ出す。公開は Tailscale Serve（deploy.sh up）
      - "127.0.0.1:8020:8020"
    env_file: .env
    environment:
      - TZ=Asia/Tokyo
    volumes:
      - ./data:/data
  # RunPod Serverless 中継（編集ジョブ）。.env に RUNPOD_API_KEY / RUNPOD_ENDPOINT_ID を入れると動き出す
  runpod-worker:
    build: .
    container_name: krea2-runpod-worker
    restart: unless-stopped
    command: ["python", "-u", "runpod_worker.py"]
    healthcheck:
      disable: true   # Dockerfile の HEALTHCHECK は Web 用
    env_file: .env
    environment:
      - TZ=Asia/Tokyo
      - GALLERY_URL=http://gallery:8020
    depends_on:
      - gallery
