<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Krea2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Krea2 Gallery</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b35; --fg: #e6e8ee; --muted: #8b93a5;
    --accent: #f5b940; --danger: #e5534b; --add: #3fb950; --del: #f85149;
    --c-gen: #5b9cf6; --c-dataset: #3fb950; --c-train: #c77dff; --c-note: #f5b940; --c-trash: #8b93a5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tabs button { border: 0; background: transparent; color: var(--fg); padding: 4px 14px; cursor: pointer; font-size: 13px; }
  .tabs button.on { background: var(--line); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 13px; }
  .chip.on { background: var(--accent); color: #000; border-color: var(--accent); }
  .chip.evf { border-color: var(--c); }
  .chip.evf.on { background: var(--c); color: #000; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); font-size: 12px; }
  .search { background: var(--bg); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 5px 10px; font-size: 13px; min-width: 200px; }
  main { padding: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; position: relative; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #000; }
  .card .cap { padding: 8px 10px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  .card .cap b { color: var(--fg); font-weight: 500; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .card .cap .row { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; }
  .card .star { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.55); border: 0; color: #fff; font-size: 16px; border-radius: 6px; padding: 2px 7px; cursor: pointer; }
  .card .star.on { color: var(--accent); }
  .card .badge { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; border-radius: 6px; padding: 2px 7px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  /* timeline */
  .tl { max-width: 1100px; margin: 0 auto; }
  .tl .day { color: var(--muted); font-size: 12px; margin: 18px 0 6px; padding-left: 6px; }
  .ev { display: grid; grid-template-columns: 64px 84px 1fr; gap: 12px; padding: 10px 8px; border-left: 3px solid var(--c, var(--line)); margin-bottom: 6px; background: var(--panel); border-radius: 0 8px 8px 0; }
  .ev.gone { opacity: .55; }
  .ev .t { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .ev .kind { font-size: 11px; color: var(--c); font-weight: 600; letter-spacing: .02em; }
  .ev .kind small { display: block; color: var(--muted); font-weight: 400; }
  .ev .body { min-width: 0; }
  .ev .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; background: #000; cursor: pointer; display: block; }
  .ev .prompt { white-space: pre-wrap; word-break: break-word; }
  .ev .prompt ins { background: rgba(63,185,80,.22); color: var(--add); text-decoration: none; border-radius: 3px; padding: 0 2px; }
  .ev .prompt del { background: rgba(248,81,73,.18); color: var(--del); border-radius: 3px; padding: 0 2px; }
  .ev .kv { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
  .ev .kv b { color: var(--fg); font-weight: 500; }
  .ev .note { border-left: 2px solid var(--c-note); padding-left: 8px; white-space: pre-wrap; }
  .ev pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 12px; overflow: auto; margin: 6px 0 0; max-height: 220px; }
  .ev .ds { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .ev .ds img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; cursor: pointer; }
  .tag { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); margin-left: 6px; }
  .tag.trash { border-color: var(--danger); color: var(--danger); }
  .sbtn { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 4px; padding: 1px 8px; font-size: 11px; cursor: pointer; }
  .sbtn:hover { color: var(--fg); }
  .notebox { display: flex; gap: 8px; margin: 0 auto 10px; max-width: 1100px; }
  .notebox input { flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .notebox button { border: 1px solid var(--c-note); background: transparent; color: var(--c-note); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  /* graph */
  #graph { position: relative; overflow: auto; height: calc(100vh - 70px); }
  #gtools { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  #gtools button { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  #gtools .legend { display: flex; gap: 10px; font-size: 11px; color: var(--muted); margin-left: auto; }
  #gtools .legend i { display: inline-block; width: 18px; border-top: 2px solid var(--muted); vertical-align: middle; margin-right: 4px; }
  #gtools .legend i.dash { border-top-style: dashed; }
  #gtools .legend i.inf { border-top-color: var(--c-gen); opacity: .5; }
  #gcanvas { position: relative; transform-origin: 0 0; }
  #gcanvas svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #gcanvas svg path { fill: none; stroke: #4b5363; stroke-width: 1.5; }
  #gcanvas svg path.inferred { stroke-dasharray: 4 3; opacity: .7; }
  #gcanvas svg path.secondary { stroke: var(--c-train); stroke-dasharray: 6 4; }
  #gcanvas svg path.secondary.ds { stroke: var(--c-dataset); }
  #gcanvas svg text { font-size: 10px; fill: var(--muted); }
  #gcanvas svg text .add { fill: var(--add); }
  #gcanvas svg text .del { fill: var(--del); }
  .gn { position: absolute; width: 150px; height: 112px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 6px; font-size: 11px; color: var(--muted); }
  .gn:hover { border-color: var(--fg); }
  .gn img { width: 68px; height: 68px; object-fit: cover; border-radius: 5px; background: #000; display: block; }
  .gn .l1 { margin-top: 4px; color: var(--fg); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .gn .l2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .gn.gen { border-left: 3px solid var(--c-gen); }
  .gn.dataset { border-left: 3px solid var(--c-dataset); }
  .gn.run { border-left: 3px solid var(--c-train); justify-content: center; }
  .gn.run .l1 { font-size: 12px; }
  .gn.base, .gn.dsgroup { justify-content: center; height: 60px; }
  .gn.base { border-left: 3px solid var(--muted); }
  .gn.dsgroup { border-left: 3px solid var(--c-dataset); }
  .gn.base .l1, .gn.dsgroup .l1, .gn.run .l1 { white-space: normal; text-align: center; }
  .gn .star { position: absolute; top: 3px; right: 5px; color: var(--accent); font-size: 12px; }
  .gn .cur { position: absolute; inset: 0; border: 2px solid var(--accent); border-radius: 8px; pointer-events: none; }
  .gn.bundle { justify-content: center; background: linear-gradient(180deg, var(--panel), var(--bg)); border-style: dashed; }
  .gn.bundle .stack { position: relative; width: 80px; height: 68px; }
  .gn.bundle .stack img { position: absolute; width: 56px; height: 56px; border: 1px solid var(--line); }
  .gn.bundle.open { height: 40px; width: 110px; }
  .gn.bundle.open .l1 { margin: 0; }
  .gtip { position: fixed; z-index: 30; background: #000; color: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12px; max-width: 420px; pointer-events: none; white-space: pre-wrap; display: none; }
  #picker { position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 40; display: none; align-items: center; justify-content: center; }
  #picker.open { display: flex; }
  #picker .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(920px, 94vw); max-height: 84vh; overflow: auto; padding: 14px; }
  #picker .box h3 { margin: 0 0 10px; font-size: 14px; }
  #picker .pg { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  #picker .pg div { cursor: pointer; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-size: 10px; color: var(--muted); }
  #picker .pg div:hover { border-color: var(--accent); }
  #picker .pg img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  #picker .pg span { display: block; padding: 3px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #picker .act { display: flex; gap: 8px; margin-bottom: 10px; }
  #picker button { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  #lb .parent { display: flex; align-items: center; gap: 8px; }
  #lb .parent img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; cursor: pointer; }
  #lb .parent small { color: var(--muted); display: block; }
  /* ops (操作) */
  #ops { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px; }
  .op { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .op h2 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .op h2 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .op h2 .dot.on { background: var(--add); box-shadow: 0 0 6px var(--add); }
  .op .kv { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .op .kv b { color: var(--fg); font-weight: 500; }
  .bar { height: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--c-gen); width: 0; transition: width .4s; }
  .bar.train i { background: var(--c-train); }
  .log { background: #000; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 11px/1.4 ui-monospace, Menlo, monospace; color: #b8c0cc; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .loss { width: 100%; height: 70px; display: block; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .form label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
  .form label.wide { grid-column: 1 / -1; }
  .form input, .form select, .form textarea { background: var(--bg); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 9px 10px; font-size: 16px; font-family: inherit; }
  .form textarea { min-height: 72px; resize: vertical; }
  .form .act { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn-p { border: 0; background: var(--accent); color: #000; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-p:disabled { opacity: .5; }
  .btn-s { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .btn-s.danger { border-color: var(--danger); color: var(--danger); }
  .optabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .optabs button { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 8px; padding: 8px 0; cursor: pointer; font-size: 13px; }
  .optabs button.on { background: var(--line); }
  .jobs { display: flex; flex-direction: column; gap: 6px; }
  .job { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; cursor: pointer; }
  .job .st { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; text-align: center; background: var(--line); color: var(--fg); }
  .job .st.running { background: var(--c-gen); color: #000; } .job .st.done { background: var(--add); color: #000; } .job .st.failed { background: var(--danger); color: #fff; } .job .st.queued { background: var(--c-note); color: #000; }
  .job .t { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job .t small { color: var(--muted); display: block; }
  .hint { font-size: 11px; color: var(--muted); }
  @media (max-width: 700px) {
    header { padding: 8px 10px; gap: 8px; }
    header h1 { display: none; }
    .tabs button { padding: 6px 10px; }
    .search { min-width: 0; width: 100%; order: 9; }
    #count, #updated { font-size: 11px; }
    main { padding: 10px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .form { grid-template-columns: 1fr; }
    .ev { grid-template-columns: 48px 1fr; } .ev .kind { grid-column: 1 / -1; }
    #gtools .legend, #gtools > span.muted { display: none; }
    #graph { height: calc(100vh - 120px); -webkit-overflow-scrolling: touch; }
  }
  /* lightbox */
  #lb { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; z-index: 20; }
  #lb.open { display: grid; grid-template-columns: 1fr 380px; }
  #lb .view { display: flex; align-items: center; justify-content: center; padding: 16px; min-width: 0; }
  #lb .view img { max-width: 100%; max-height: calc(100vh - 32px); object-fit: contain; }
  #lb aside { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow: auto; font-size: 13px; }
  #lb aside h2 { font-size: 14px; margin: 0 0 10px; word-break: break-all; }
  #lb aside h3 { font-size: 12px; color: var(--muted); margin: 18px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  #lb dl { margin: 0; }
  #lb dt { color: var(--muted); font-size: 11px; margin-top: 10px; }
  #lb dd { margin: 2px 0 0; word-break: break-word; white-space: pre-wrap; }
  #lb .btns { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  #lb button, #lb a.btn { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; padding: 6px 12px; cursor: pointer; text-decoration: none; font-size: 13px; }
  #lb button.on { border-color: var(--accent); color: var(--accent); }
  #lb button.danger { border-color: var(--danger); color: var(--danger); }
  #lb .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.08); border: 0; color: #fff; font-size: 28px; width: 44px; height: 80px; cursor: pointer; border-radius: 8px; }
  #lb .prev { left: 10px; } #lb .next { right: 396px; }
  #lb .close { position: absolute; top: 10px; right: 396px; background: rgba(255,255,255,.08); border: 0; color: #fff; font-size: 20px; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; }
  #lb .sib { display: flex; gap: 6px; flex-wrap: wrap; }
  #lb .sib a { display: block; text-align: center; font-size: 10px; color: var(--muted); cursor: pointer; }
  #lb .sib img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; display: block; }
  #lb .sib a.cur img { outline: 2px solid var(--accent); }
  #lb .lnote { border-left: 2px solid var(--c-note); padding-left: 8px; margin: 6px 0; white-space: pre-wrap; }
  #lb .lnote small { color: var(--muted); display: block; }
  #lb .notein { display: flex; gap: 6px; margin-top: 6px; }
  #lb .notein input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 5px 8px; font-size: 12px; }
  @media (max-width: 800px) {
    #lb.open { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    #lb aside { border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
    #lb .next { right: 10px; } #lb .close { right: 10px; }
    .ev { grid-template-columns: 56px 1fr; } .ev .kind { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header>
  <h1>Krea2 Gallery</h1>
  <div class="tabs"><button id="tabGraph">系統図</button><button id="tabGrid">画像</button><button id="tabHist">履歴</button><button id="tabOps">操作</button></div>
  <div class="chips" id="folders"></div>
  <div class="chips" id="evFilters" style="display:none"></div>
  <button class="chip" id="starFilter">★ お気に入りのみ</button>
  <div class="spacer"></div>
  <input class="search" id="search" type="search" placeholder="プロンプト / メモで検索">
  <span class="muted" id="count"></span>
  <span class="muted" id="updated"></span>
</header>
<main>
  <div id="graph" style="display:none">
    <div id="gtools">
      <button id="gExpand">すべて展開</button><button id="gCollapse">束ねる</button>
      <button id="gZoomOut">−</button><span class="muted" id="gZoomLabel">100%</span><button id="gZoomIn">＋</button>
      <button id="gFit">最新へ</button>
      <span class="muted">兄弟 6 枚以上・連鎖 6 件以上は 5 つずつ束ねます（クリックで開閉）。矢印の緑字 = 追加された語</span>
      <span class="legend"><span><i></i>派生（指定）</span><span><i class="inf"></i>派生（推定）</span><span><i class="dash" style="border-color:var(--c-train)"></i>LoRA</span><span><i class="dash" style="border-color:var(--c-dataset)"></i>素材化</span></span>
    </div>
    <div id="gcanvas"><svg id="gsvg"></svg><div id="gnodes"></div></div>
  </div>
  <div class="gtip" id="gtip"></div>
  <div id="ops" style="display:none">
    <div class="op">
      <h2><span class="dot" id="wDot"></span>WSL2 ワーカー <span class="hint" id="wAge"></span></h2>
      <div class="kv" id="wInfo">読み込み中…</div>
    </div>
    <div class="op" id="curJobBox" style="display:none">
      <h2>実行中 <span class="hint" id="cjTitle"></span></h2>
      <div class="kv" id="cjInfo"></div>
      <div class="bar" id="cjBar"><i></i></div>
      <div class="hint" id="cjEta"></div>
      <svg class="loss" id="cjLoss" viewBox="0 0 600 70" preserveAspectRatio="none" style="display:none"></svg>
      <div class="log" id="cjLog"></div>
      <div style="margin-top:8px;display:flex;gap:8px"><button class="btn-s danger" id="cjCancel">中止</button></div>
    </div>
    <div class="op">
      <div class="optabs"><button class="on" data-f="gen">生成</button><button data-f="train">学習</button><button data-f="compare">比較</button><button data-f="note">メモ</button></div>
      <form class="form" id="fGen">
        <label class="wide">プロンプト<textarea name="prompt" required placeholder="kuropanda, 1girl, black panda hoodie, ..."></textarea></label>
        <label>seed<input name="seed" type="number" value="0" inputmode="numeric"></label>
        <label>LoRA<select name="lora"><option value="">なし（ベース）</option></select></label>
        <label>出力フォルダ<input name="folder" value="test" placeholder="test"></label>
        <label>枚数（seed を +1 ずつ）<input name="count" type="number" value="1" min="1" max="8" inputmode="numeric"></label>
        <label class="wide">派生元（任意・ギャラリー上のパス）<input name="parent" placeholder="test/2026....png"></label>
        <label class="wide">メモ（なぜこのプロンプトか）<input name="note" placeholder="耳を大きくしたい"></label>
        <div class="act"><button class="btn-p" type="submit">生成をキューに入れる</button><span class="hint">1 枚 約 1 分（モデル読込込み）</span></div>
      </form>
      <form class="form" id="fTrain" style="display:none">
        <label>run 名<input name="run" required pattern="[A-Za-z0-9_.-]+" placeholder="kuropanda_v1"></label>
        <label>max steps<input name="steps" type="number" value="1800" inputmode="numeric"></label>
        <label>save every<input name="save_every" type="number" value="300" inputmode="numeric"></label>
        <label>dim / alpha<input name="dim" type="number" value="32" inputmode="numeric"></label>
        <label>learning rate<input name="lr" value="1e-4"></label>
        <label>blocks_to_swap<input name="swap" type="number" value="16" inputmode="numeric"></label>

<script>
const EV = {
  gen:         { label: "生成",   color: "var(--c-gen)" },
  dataset:     { label: "素材",   color: "var(--c-dataset)" },
  train_start: { label: "学習開始", color: "var(--c-train)" },
  train_end:   { label: "学習完了", color: "var(--c-train)" },
  note:        { label: "メモ",   color: "var(--c-note)" },
  trash:       { label: "ゴミ箱", color: "var(--c-trash)" },
};
const state = { view: "graph", folder: null, graph: null, gExp: new Map(JSON.parse(localStorage.getItem("gExp") || "[]")), gZoom: 1, gHighlight: null, star: false, q: "", evOn: new Set(["gen", "dataset", "train_start", "train_end", "note"]),
                items: [], folders: [], hist: [], idx: -1 };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function fmtTime(t) {
  const d = new Date(t * 1000); const p = (n) => String(n).padStart(2, "0");
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function loraShort(m) {
  if (!m) return "";
  if (m.run && m.step) return `${m.run} · step ${m.step}`;
  if (!m.lora) return "";
  const b = String(m.lora).split("/").pop();
  const mt = b.match(/^(.+?)-(\d{6})\.safetensors$/);
  return mt ? `${mt[1]} · step ${parseInt(mt[2], 10)}` : b.replace(/\.safetensors$/, "");
}
function matchQ(...texts) {
  if (!state.q) return true;
  const hay = texts.filter(Boolean).join(" ").toLowerCase();
  return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); } catch (e) {
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  if (btn) { const o = btn.textContent; btn.textContent = "コピー済"; setTimeout(() => btn.textContent = o, 1200); }
}

/* ---------- word diff (LCS) ---------- */
function tokenize(s) { return String(s || "").split(/(\s*,\s*|\s+)/).filter(t => t.length); }
function lcsLen(A, B) {
  const n = A.length, m = B.length;
  let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1);
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) cur[j] = A[i] === B[j] ? prev[j+1] + 1 : Math.max(prev[j], cur[j+1]);
    [prev, cur] = [cur, prev];
  }
  return prev[0];
}
function similarity(a, b) {
  const A = tokenize(a).filter(t => t.trim()), B = tokenize(b).filter(t => t.trim());
  if (!A.length || !B.length) return 0;
  return lcsLen(A, B) / Math.max(A.length, B.length);
}
function diffWords(a, b) {
  const A = tokenize(a), B = tokenize(b);
  const n = A.length, m = B.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = A[i] === B[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i = 0, j = 0, out = "";
  while (i < n && j < m) {
    if (A[i] === B[j]) { out += esc(B[j]); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) { if (A[i].trim()) out += `<del>${esc(A[i])}</del>`; i++; }
    else { out += B[j].trim() ? `<ins>${esc(B[j])}</ins>` : esc(B[j]); j++; }
  }
  while (i < n) { if (A[i].trim()) out += `<del>${esc(A[i])}</del>`; i++; }
  while (j < m) { out += B[j].trim() ? `<ins>${esc(B[j])}</ins>` : esc(B[j]); j++; }
  return out;
}

/* ---------- load ---------- */
async function load() {
  if (state.view === "hist") return loadHist();
  if (state.view === "graph") return loadGraph();
  if (state.view === "ops") return loadOps();
  const q = new URLSearchParams();
  if (state.folder !== null) q.set("folder", state.folder);
  if (state.star) q.set("star", "true");
  const r = await fetch("/api/images?" + q); const j = await r.json();
  state.items = j.items.filter(i => matchQ(i.meta && i.meta.prompt, i.meta && i.meta.caption, i.name));
  state.folders = j.folders;
  renderFolders(); renderGrid();
  $("#count").textContent = `${state.items.length} 枚`;
  $("#updated").textContent = "更新 " + new Date().toLocaleTimeString("ja-JP");
}
async function loadHist() {
  const r = await fetch("/api/history"); const j = await r.json();
  state.folders = [...new Set(j.items.map(h => h.folder).filter(f => f !== undefined && f !== null))].sort();
  state.hist = j.items.filter(h => state.evOn.has(h.event)
    && (state.folder === null || h.folder === state.folder || h.event === "note" || h.event.startsWith("train"))
    && matchQ(h.meta && h.meta.prompt, h.meta && h.meta.caption, h.text, h.run, h.note, h.meta && h.meta.note));
  renderFolders(); renderEvFilters(); renderTimeline(j.items);
  $("#count").textContent = `${state.hist.length} 件`;
  $("#updated").textContent = "更新 " + new Date().toLocaleTimeString("ja-JP");
}

function renderFolders() {
  const el = $("#folders"); el.innerHTML = "";
  const mk = (label, val) => { const b = document.createElement("button"); b.className = "chip" + (state.folder === val ? " on" : ""); b.textContent = label; b.onclick = () => { state.folder = val; load(); }; el.appendChild(b); };
  mk("すべて", null);
  for (const f of state.folders) mk(f || "(root)", f);
  $("#starFilter").className = "chip" + (state.star ? " on" : "");
}
function renderEvFilters() {
  const el = $("#evFilters"); el.innerHTML = "";
  for (const [k, v] of Object.entries(EV)) {
    const b = document.createElement("button"); b.className = "chip evf" + (state.evOn.has(k) ? " on" : ""); b.style.setProperty("--c", v.color); b.textContent = v.label;
    b.onclick = () => { state.evOn.has(k) ? state.evOn.delete(k) : state.evOn.add(k); load(); }; el.appendChild(b);
  }
}

function renderGrid() {
  const g = $("#grid"); g.innerHTML = "";
  $("#empty").style.display = state.items.length ? "none" : "block";
  state.items.forEach((it, i) => {
    const m = it.meta || {};
    const c = document.createElement("div"); c.className = "card";
    const badge = m.stage === "dataset" || it.folder.startsWith("dataset") ? "素材" + (m.source ? " · " + m.source : "") : loraShort(m);
    c.innerHTML = `
      <img loading="lazy" src="/thumb/${encodeURI(it.path)}?v=${it.mtime}" alt="">
      ${badge ? `<span class="badge">${esc(badge)}</span>` : ""}
      <button class="star ${it.star ? "on" : ""}" title="お気に入り">★</button>
      <div class="cap"><b></b><div class="row"><span>${m.seed !== undefined && m.seed !== null ? "seed " + esc(m.seed) : esc(it.name)}</span><span>${fmtTime(it.mtime)}</span></div></div>`;
    c.querySelector(".cap b").textContent = m.caption || m.prompt || it.name;
    c.querySelector("img").onclick = () => open(i);
    c.querySelector(".cap").onclick = () => open(i);
    c.querySelector(".star").onclick = (e) => { e.stopPropagation(); toggleStar(it); };
    g.appendChild(c);
  });
}

/* ---------- timeline ---------- */
function renderTimeline(all) {
  const tl = $("#tl"); tl.innerHTML = "";
  $("#empty").style.display = state.hist.length ? "none" : "block";
  // 比較相手 = それ以前の生成（直近 30 件）のうち最もプロンプトが似ているもの（LCS 類似度）。
  // 似たものが無ければ差分は出さない。「いったん別の構図を試して戻る」流れでも差分がうるさくならない。
  const prevPrompt = new Map();
  const seen = [];
  for (const h of [...all].reverse()) {
    if (h.event !== "gen") continue;
    const p = (h.meta || {}).prompt || "";
    if (!p) continue;
    let best = null, bestScore = 0;
    for (const q of seen.slice(-30)) {
      if (q === p) { best = q; bestScore = 1; break; }
      const sc = similarity(q, p);
      if (sc > bestScore) { bestScore = sc; best = q; }
    }
    if (best && bestScore >= 0.35) prevPrompt.set(h, best);
    seen.push(p);
  }
  let day = "";
  for (const h of state.hist) {
    const d = (h.ts || "").slice(0, 10);
    if (d !== day) { day = d; const el = document.createElement("div"); el.className = "day"; el.textContent = d; tl.appendChild(el); }
    const ev = EV[h.event] || { label: h.event, color: "var(--line)" };
    const m = h.meta || {};
    const row = document.createElement("div"); row.className = "ev" + (h.path && !h.exists ? " gone" : ""); row.style.setProperty("--c", ev.color);
    let body = "";
    if (h.event === "gen") {
      const prev = prevPrompt.get(h);
      const promptHtml = prev && prev !== m.prompt ? diffWords(prev, m.prompt) : esc(m.prompt || "");
      body = `<div class="prompt">${promptHtml}</div>
        <div class="kv">${m.seed !== undefined ? `<span>seed <b>${esc(m.seed)}</b></span>` : ""}
          ${loraShort(m) ? `<span>LoRA <b>${esc(loraShort(m))}</b></span>` : `<span>LoRA <b>なし</b></span>`}
          ${m.steps !== undefined ? `<span>steps/g/mu <b>${esc(m.steps)} / ${esc(m.guidance_scale)} / ${esc(m.mu)}</b></span>` : ""}
          <span>${esc(h.folder || "(root)")}</span>
          ${m.prompt ? `<button class="sbtn cp">プロンプトをコピー</button>` : ""}
          ${h.trashed ? `<span class="tag trash">ゴミ箱</span>` : (h.exists === false ? `<span class="tag">ファイル無し</span>` : "")}${h.backfilled ? `<span class="tag">補完</span>` : ""}</div>
        ${m.note ? `<div class="note" style="margin-top:6px">${esc(m.note)}</div>` : ""}`;
    } else if (h.event === "dataset") {
      body = `<div class="prompt"><b>${esc(m.caption || "")}</b></div>
        <div class="kv">${m.source ? `<span>出所 <b>${esc(m.source)}</b></span>` : ""}<span>${esc(h.folder)}</span>${h.trashed ? `<span class="tag trash">ゴミ箱</span>` : ""}</div>
        ${m.prompt ? `<div class="muted" style="margin-top:4px">作り方: ${esc(m.prompt)}</div>` : ""}
        ${m.note ? `<div class="note" style="margin-top:6px">${esc(m.note)}</div>` : ""}`;
    } else if (h.event === "train_start" || h.event === "train_end") {
      const cfg = h.config || {};
      const cks = h.checkpoints || [];
      body = `<div><b>${esc(h.run || "")}</b> ${h.event === "train_end" ? `— ${esc(h.status || "done")}${h.duration_min ? ` (${esc(h.duration_min)} 分)` : ""}` : ""}</div>
        <div class="kv">${Object.entries(cfg).map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("")}</div>
        ${h.dataset_folder ? `<div class="muted" style="margin-top:4px">素材: ${esc(h.dataset_folder)}（${(h.dataset || []).length} 枚）</div>` : ""}
        ${(h.dataset || []).length ? `<div class="ds">${h.dataset.map(d => `<img loading="lazy" src="/thumb/${encodeURI((h.dataset_folder || "dataset") + "/" + d.file)}" title="${esc(d.caption || d.file)}" data-p="${esc((h.dataset_folder || "dataset") + "/" + d.file)}">`).join("")}</div>` : ""}
        ${cks.length ? `<div class="muted" style="margin-top:4px">チェックポイント: ${cks.map(esc).join(", ")}</div>` : ""}
        ${h.note ? `<div class="note" style="margin-top:6px">${esc(h.note)}</div>` : ""}
        ${h.command ? `<details><summary class="muted" style="cursor:pointer">コマンド</summary><pre>${esc(h.command)}</pre></details>` : ""}`;
    } else if (h.event === "note") {
      body = `<div class="note">${esc(h.text)}</div>${h.ref ? `<div class="kv"><span>対象 <b>${esc(h.ref)}</b></span></div>` : ""}`;
    } else if (h.event === "trash") {
      body = `<div class="muted">${esc(h.path)} をゴミ箱へ</div>`;
    } else {
      body = `<pre>${esc(JSON.stringify(h, null, 1))}</pre>`;
    }
    row.innerHTML = `
      <div>${h.path && h.exists ? `<img class="thumb" loading="lazy" src="/thumb/${encodeURI(h.path)}" data-p="${esc(h.path)}">` : ""}</div>
      <div><div class="kind">${ev.label}<small>${esc((h.ts || "").slice(11, 16))}</small></div></div>
      <div class="body">${body}</div>`;
    row.querySelectorAll("img[data-p]").forEach(im => im.onclick = () => openPath(im.dataset.p));
    const cp = row.querySelector(".cp"); if (cp) cp.onclick = () => copyText(m.prompt, cp);
    tl.appendChild(row);
  }
}


/* ---------- graph (系統図) ---------- */
const GW = 150, GH = 112, GCOLW = 260, GROWH = 128, GPAD = 24, BUNDLE = 5;
function expKey(k, def) { return state.gExp.has(k) ? state.gExp.get(k) : def; }
function setExp(k, v) { state.gExp.set(k, v); localStorage.setItem("gExp", JSON.stringify([...state.gExp])); renderGraph(); }
function tsOf(n) { return typeof n.ts === "number" ? n.ts : (n.ts ? Date.parse(n.ts) / 1000 : 0); }

async function loadGraph() {
  const r = await fetch("/api/graph"); state.graph = await r.json();
  state.folders = [...new Set(state.graph.nodes.filter(n => n.path).map(n => n.folder))].sort();
  renderFolders(); renderGraph();
  const n = state.graph.nodes.filter(n => n.path).length;
  $("#count").textContent = `${n} 枚`;
  $("#updated").textContent = "更新 " + new Date().toLocaleTimeString("ja-JP");
}

function buildDisplay() {
  const G = state.graph; if (!G) return [];
  const byId = new Map(G.nodes.map(n => [n.id, n]));
  const kids = new Map();
  for (const n of G.nodes) { if (n.parent && byId.has(n.parent)) { if (!kids.has(n.parent)) kids.set(n.parent, []); kids.get(n.parent).push(n); } }
  for (const arr of kids.values()) arr.sort((a, b) => tsOf(a) - tsOf(b));
  function subtreeHasFolder(n) { const k = kids.get(n.id) || []; return k.some(c => c.folder === state.folder || subtreeHasFolder(c)); }
  const visible = (n) => state.folder === null || !n.path || n.folder === state.folder || subtreeHasFolder(n);
  const mk = (n) => ({ kind: "node", node: n, id: n.id, children: processKids(n) });
  function chunk(arr) { const out = []; for (let i = 0; i < arr.length; i += BUNDLE) out.push(arr.slice(i, i + BUNDLE)); return out; }
  function processKids(n) {
    const k = (kids.get(n.id) || []).filter(visible);
    if (k.length === 0) return [];
    if (k.length === 1) {
      const chain = []; let cur = k[0];
      while (true) { chain.push(cur); const ck = (kids.get(cur.id) || []).filter(visible); if (ck.length === 1) cur = ck[0]; else break; }
      if (chain.length <= BUNDLE) return [chainDisplay(chain)];
      const segs = chunk(chain); let next = null;
      for (let i = segs.length - 1; i >= 0; i--) {
        const key = `${n.id}/c${i}`, open = expKey(key, i === segs.length - 1), seg = segs[i], last = i === segs.length - 1;
        if (open) next = { kind: "bundle", open: true, key, items: seg, orient: "h", id: key, children: [chainDisplay(seg, last ? null : next)] };
        else next = { kind: "bundle", open: false, key, items: seg, orient: "h", id: key, children: last ? processKids(seg[seg.length - 1]) : [next] };
      }
      return [next];
    }
    if (k.length > BUNDLE) {
      const segs = chunk(k);
      return segs.map((seg, i) => { const key = `${n.id}/s${i}`, open = expKey(key, i === segs.length - 1);
        return { kind: "bundle", open, key, items: seg, orient: "v", id: key, children: open ? seg.map(mk) : [] }; });
    }
    return k.map(mk);
  }
  function chainDisplay(chain, tail) {
    let d = null;
    for (let i = chain.length - 1; i >= 0; i--) {
      const n = chain[i];
      const children = d ? [d] : (tail ? [tail] : processKids(n));
      d = { kind: "node", node: n, id: n.id, children };
    }
    return d;
  }
  return G.nodes.filter(n => !n.parent && visible(n)).map(mk);
}

function layout(roots) {
  const h = (d) => { d._h = d.children.length ? d.children.reduce((a, c) => a + h(c), 0) : 1; return d._h; };
  const place = (d, depth, top) => {
    d.depth = depth;
    if (!d.children.length) { d.row = top; return; }
    let t = top; for (const c of d.children) { place(c, depth + 1, t); t += c._h; }
    d.row = (d.children[0].row + d.children[d.children.length - 1].row) / 2;
  };
  let top = 0; for (const r of roots) { h(r); place(r, 0, top); top += r._h; }
  const all = []; const walk = (d) => { all.push(d); d.children.forEach(walk); }; roots.forEach(walk);
  for (const d of all) {
    d.w = d.kind === "bundle" && d.open ? 110 : GW;
    d.hh = d.kind === "bundle" && d.open ? 40 : (d.kind === "node" && (d.node.type === "base" || d.node.type === "dsgroup") ? 60 : GH);
    d.x = GPAD + d.depth * GCOLW; d.y = GPAD + d.row * GROWH + (GH - d.hh) / 2;
  }
  return all;
}

function addedWords(a, b) {
  const A = new Set(tokenize(a).filter(t => t.trim())), B = tokenize(b).filter(t => t.trim());
  const add = B.filter(t => !A.has(t)); const Bs = new Set(B); const del = [...A].filter(t => !Bs.has(t));
  return { add, del };
}

function renderGraph() {
  if (!state.graph) return;
  const roots = buildDisplay(); const all = layout(roots);

  const maxX = Math.max(0, ...all.map(d => d.x + d.w)) + GPAD, maxY = Math.max(0, ...all.map(d => d.y + d.hh)) + GPAD;

    else html += `<div class="muted" style="margin-top:4px">学習イベント未記録（train.sh を使うと記録されます）</div>`;
    if (L.dataset.length) {
      html += `<h3>素材 ${L.dataset.length} 枚（${esc(L.dataset_folder)}）</h3><div class="sib">${L.dataset.map(d => `<a data-p="${esc(d.path)}"><img src="/thumb/${encodeURI(d.path)}" title="${esc((d.meta || {}).caption || d.name)}"></a>`).join("")}</div>`;
    }
    if (L.siblings.length) {
      const sibs = [{ path: L.path, step: L.step, seed: (L.meta || {}).seed, cur: true }, ...L.siblings].sort((a, b) => (a.step || 0) - (b.step || 0) || (a.seed || 0) - (b.seed || 0));
      html += `<h3>同じ run の比較</h3><div class="sib">${sibs.map(s => `<a data-p="${esc(s.path)}" class="${s.cur ? "cur" : ""}"><img src="/thumb/${encodeURI(s.path)}">${s.step ? "step " + esc(s.step) : "base"}<br>seed ${esc(s.seed ?? "")}</a>`).join("")}</div>`;
    }
  } else if ((L.meta || {}).stage === "dataset" || it.folder.startsWith("dataset")) {
    html += `<h3>系譜</h3><div class="muted">学習素材。${(L.meta || {}).source ? "出所: " + esc(L.meta.source) : ""}</div>`;
  } else {
    html += `<h3>系譜</h3><div class="muted">ベースモデルのみ（LoRA なし）</div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll("a[data-p]").forEach(a => a.onclick = () => openPath(a.dataset.p));
  $("#lbNotes").innerHTML = L.notes.length ? L.notes.map(n => `<div class="lnote">${esc(n.text)}<small>${esc(n.ts.replace("T", " "))}</small></div>`).join("") : `<div class="muted">なし</div>`;
}
function close() { $("#lb").classList.remove("open"); state.idx = -1; if (state.view === "graph") loadGraph(); }
function step(d) { if (state.idx < 0) return; open((state.idx + d + state.items.length) % state.items.length); }
async function del() {
  if (state.idx < 0) return;
  const it = state.items[state.idx];
  const r = await fetch("/api/images/" + encodeURI(it.path), { method: "DELETE" });
  if (r.ok) { close(); load(); }
}
async function addNote(text, ref) {
  text = (text || "").trim(); if (!text) return;
  await fetch("/api/note", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, ref }) });
}
function setView(v) {
  state.view = v;
  for (const [k, id] of [["graph", "tabGraph"], ["grid", "tabGrid"], ["hist", "tabHist"], ["ops", "tabOps"]]) document.getElementById(id).className = v === k ? "on" : "";
  $("#graph").style.display = v === "graph" ? "" : "none"; $("#grid").style.display = v === "grid" ? "" : "none"; $("#hist").style.display = v === "hist" ? "" : "none"; $("#ops").style.display = v === "ops" ? "" : "none";
  $("#folders").style.display = v === "ops" ? "none" : ""; $("#search").style.display = v === "ops" ? "none" : "";
  $("#starFilter").style.display = v === "grid" ? "" : "none"; $("#evFilters").style.display = v === "hist" ? "" : "none";
  location.hash = v === "graph" ? "" : "#" + v;
  load();
}

$("#prev").onclick = () => step(-1);
$("#next").onclick = () => step(1);
$("#close").onclick = close;
$("#lbStar").onclick = () => toggleStar(state.items[state.idx]);
$("#lbCopy").onclick = () => { const m = state.items[state.idx].meta || {}; if (m.prompt) copyText(m.prompt, $("#lbCopy")); };
$("#lbDel").onclick = del;
$("#lbNoteAdd").onclick = async () => { const it = state.items[state.idx]; await addNote($("#lbNoteText").value, it.path); $("#lbNoteText").value = ""; loadLineage(it); };
$("#lbNoteText").onkeydown = (e) => { if (e.key === "Enter") $("#lbNoteAdd").click(); e.stopPropagation(); };
$("#noteAdd").onclick = async () => { await addNote($("#noteText").value, null); $("#noteText").value = ""; load(); };
$("#noteText").onkeydown = (e) => { if (e.key === "Enter") $("#noteAdd").click(); };
$("#starFilter").onclick = () => { state.star = !state.star; load(); };
$("#tabGrid").onclick = () => setView("grid");
$("#tabHist").onclick = () => setView("hist");
let _qt; $("#search").oninput = (e) => { clearTimeout(_qt); _qt = setTimeout(() => { state.q = e.target.value; load(); }, 250); };
$("#lb .view").onclick = (e) => { if (e.target === e.currentTarget) close(); };
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#picker").classList.contains("open")) { $("#picker").classList.remove("open"); return; }
  if (!$("#lb").classList.contains("open") || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
  else if (e.key === "Escape") close(); else if (e.key === "s" || e.key === "S") toggleStar(state.items[state.idx]);
});

setView(location.hash === "#hist" ? "hist" : location.hash === "#grid" ? "grid" : location.hash === "#ops" ? "ops" : "graph");
setInterval(() => { if (state.idx < 0 && state.view !== "ops") load(); }, 20000);
setInterval(() => { if (state.view === "ops") loadOps(); }, 4000);
</script>
</body>
</html>
